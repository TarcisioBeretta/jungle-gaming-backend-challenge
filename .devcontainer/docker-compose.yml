version: '3.8'

services:
  app:
    image: oven/bun:1.1
    container_name: jungle-gaming-app-dev
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - NODE_ENV=development
      - DATABASE_HOST=postgres
      - AWS_SQS_ENDPOINT=http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: jungle-gaming-postgres-dev
    environment:
      POSTGRES_DB: wagering_db
      POSTGRES_USER: wagering_user
      POSTGRES_PASSWORD: wagering_pass
    ports:
      - "5432:5432"
    volumes:
      - jungle_gaming_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering_user -d wagering_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    container_name: jungle-gaming-localstack-dev
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jungle_gaming_postgres_dev_data:
